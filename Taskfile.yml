version: '3'

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Vet and test (needs terraform, installed by aqua)
    cmds:
      - go vet ./...
      - go test ./...

  install:
    desc: Build the provider into $GOBIN, for a dev override
    cmds:
      - go install -trimpath .
